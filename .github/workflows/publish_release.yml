name: Publish Portable Release

on: [push]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: build VC++
      run: dotnet build ./src/native/build.proj -c Release --nologo -bl:./artifacts/log/native.binlog

    - name: build .NET
      run: dotnet publish -c Release --nologo -bl:./artifacts/log/build.binlog

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          artifacts/Release/publish/GitExtensions-Portable-*.zip
